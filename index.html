function load(){

}

// 按当前「单月/累计」+ 选中月份 MM 取聚合值；obj 须含 monthly（逐月明细）
function aggOf(obj){
  if(!obj||!obj.monthly) return obj&&obj[PERIOD]?obj[PERIOD]:{target:0,actual:0,ly:0,comp:0,growth:null};
  if(PERIOD==='jul') return obj.monthly[MM]||{target:0,actual:0,ly:0,comp:0,growth:null};
  let T=0,A=0,L=0;
  for(let m=1;m<=MM;m++){const d=obj.monthly[m]; if(d){T+=d.target;A+=d.actual;L+=d.ly;}}
  const comp=T?A/T*100:0, growth=L?((A-L)/L*100):null;
  return {target:T,actual:A,ly:L,comp,growth};
}
function singleOf(obj,mm){
  const d=(obj&&obj.monthly)?obj.monthly[mm]:null;
  if(!d) return {target:0,actual:0,ly:0,comp:0,growth:null};
  const comp=d.target?d.actual/d.target*100:0, growth=d.ly?((d.actual-d.ly)/d.ly*100):null;
  return {target:d.target,actual:d.actual,ly:d.ly,comp,growth};
}
function cumOf(obj,mm){
  let T=0,A=0,L=0;
  for(let m=1;m<=mm;m++){const d=(obj&&obj.monthly)?obj.monthly[m]:null; if(d){T+=d.target;A+=d.actual;L+=d.ly;}}
  const comp=T?A/T*100:0, growth=L?((A-L)/L*100):null;
  return {target:T,actual:A,ly:L,comp,growth};
}

  HISTORY.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.year+'年 '+s.as_of_month+(s.as_of_idx===12?'（全年）':'');if(i===IDX)o.selected=true;ss.appendChild(o);});

  if(MM===0||MM>s.as_of_idx) MM=s.as_of_idx;

}

function hbar(items){
  const mx=Math.max(...items.map(i=>Math.max(i.value,i.target||0)),1);
  return items.map(i=>{
    const w=(i.value/mx*100),tw=i.target?(i.target/mx*100):0;
    const tm=i.target?`<div class="tmark" style="left:${tw}%"></div>`:'';
    return `<div class="brow"><div class="blab">${i.label}</div><div class="btrack"><div class="bfill" style="width:${w}%"></div>${tm}</div><div class="bval">${i.sub}</div></div>`;
  }).join('');
}
function lineChart(s){
  const m=s.overall.monthly,keys=Object.keys(m).slice(0,s.as_of_idx);
  const acts=keys.map(k=>m[k].actual),tgts=keys.map(k=>m[k].target);
  const mx=Math.max(...acts,...tgts,1),W=760,H=240,pad=44,n=keys.length;
  const sx=i=>pad+i*(W-2*pad)/(Math.max(n-1,1));
  const sy=v=>H-pad-(v/mx)*(H-2*pad);
  const ap="M"+acts.map((v,i)=>`${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(' L');
  const tp="M"+tgts.map((v,i)=>`${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(' L');
  const area=`${sx(0).toFixed(1)},${H-pad} `+acts.map((v,i)=>`${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(' ')+` ${sx(n-1).toFixed(1)},${H-pad}`;
  const xl=keys.map((k,i)=>`<text x="${sx(i).toFixed(1)}" y="${H-12}" class="xl">${k}</text>`).join('');
  const yl=[0,mx/2,mx].map(v=>`<text x="6" y="${(sy(v)+4).toFixed(1)}" class="yl">${Math.round(v).toLocaleString()}</text>`).join('');
  const dots=acts.map((v,i)=>`<circle cx="${sx(i).toFixed(1)}" cy="${sy(v).toFixed(1)}" r="3" class="dot"/>`).join('');
  const hl=(PERIOD==='jul'&&MM-1<n)?`<circle cx="${sx(MM-1).toFixed(1)}" cy="${sy(acts[MM-1]).toFixed(1)}" r="5" fill="none" stroke="#e23b3b" stroke-width="2"/><text x="${sx(MM-1).toFixed(1)}" y="${(sy(acts[MM-1])-10).toFixed(1)}" class="xl" fill="#e23b3b">${MONTH_CN[MM-1]}</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" class="ax"/><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" class="ax"/><polygon points="${area}" class="area"/><path d="${tp}" class="line tgt"/><path d="${ap}" class="line act"/>${yl}${xl}${dots}${hl}</svg>`;
}
function annualCard(s){

    const lf=aggOf(s.lfl);
    p.innerHTML=`${annualCard(s)}
      <div class="card"><h3>整体月度实销趋势（1–${s.as_of_month}）· 实销 vs 目标 <span style="color:var(--mut);font-weight:400;font-size:12px">（纵轴单位：千元）</span></h3>${lineChart(s)}
      <div class="legend"><b style="color:#2f6fed">■</b> 实销　<b style="color:#e0852b">┄</b> 目标　单位：千元　<b style="color:#e23b3b">○</b> 选中月</div></div>
      <div class="card"><h3>同店口径（剔除东莞新店）</h3>
      <div class="note">${perLab()}：实销 ${fmt(lf.actual)} 千元 ｜ 完成率 ${pct(lf.comp)} ｜ 同比 ${gv(lf.growth)}<br>
      累计（1–${s.as_of_month}）：实销 ${fmt(s.lfl.ytd.actual)} 千元 ｜ 完成率 ${pct(s.lfl.ytd.comp)} ｜ 同比 ${gv(s.lfl.ytd.growth)}</div></div>`;
  } else if(DIM==='store'){
    const arr=Object.entries(s.stores).map(([code,x])=>({code,n:x.name,d:aggOf(x),at:ANNUAL[code]||0})).sort((a,b)=>b.d.actual-a.d.actual);
    const tb=`<table><thead><tr><th>门店</th><th>实销（${perLab()}）</th><th>目标</th><th>完成率</th><th>同比</th><th>年度目标</th><th>年度完成率</th><th>剩余需完成</th></tr></thead><tbody>
      ${arr.map(x=>{const at=x.at;const ac=x.d.actual;const acomp=at?ac/at*100:0;const arem=at-ac;return `<tr><td class="st">${x.n}</td><td>${fmt(ac)}</td><td>${fmt(x.d.target)}</td><td class="${x.d.comp>=100?'good':'warn'}">${pct(x.d.comp)}</td><td class="${gcls(x.d.growth)}">${gv(x.d.growth)}</td><td>${at?fmt(at):'—'}</td><td class="${acomp>=100?'good':'warn'}">${pct(acomp)}</td><td class="${arem>0?'warn':'good'}">${arem>0?'+':''}${fmt(arem)}</td></tr>`}).join('')}</tbody></table>`;
    const bars=hbar(arr.map(x=>({label:x.n,value:x.d.actual,target:x.d.target,sub:`${fmt(x.d.actual)} 千元 · 完成 ${pct(x.d.comp)} · 同比 ${gv(x.d.growth)}`})));
    p.innerHTML=`<div class="card"><h3>五店对比 <span style="color:var(--mut);font-weight:400;font-size:12px">（单位：千元）</span></h3>${tb}<div style="margin-top:12px">${bars}</div></div>`;
  } else if(DIM==='group'){
    const arr=Object.entries(s.groups).map(([n,d])=>({n,d:aggOf(d)})).sort((a,b)=>b.d.actual-a.d.actual);
    const tb=`<table><thead><tr><th>集团</th><th>实销（${perLab()}）</th><th>目标</th><th>完成率</th><th>同比</th></tr></thead><tbody>
      ${arr.map(x=>`<tr><td class="st">${x.n}</td><td>${fmt(x.d.actual)}</td><td>${fmt(x.d.target)}</td><td class="${x.d.comp>=100?'good':'warn'}">${pct(x.d.comp)}</td><td class="${gcls(x.d.growth)}">${gv(x.d.growth)}</td></tr>`).join('')}</tbody></table>`;
    const bars=hbar(arr.map(x=>({label:x.n,value:x.d.actual,target:x.d.target,sub:`${fmt(x.d.actual)} 千元 · 完成 ${pct(x.d.comp)} · 同比 ${gv(x.d.growth)}`})));
    p.innerHTML=`<div class="card"><h3>集团对比（${perLab()}）<span style="color:var(--mut);font-weight:400;font-size:12px">（单位：千元）</span></h3>${tb}<div style="margin-top:12px">${bars}</div></div>`;
  } else if(DIM==='brand'){
    const groups=['全部',...Array.from(new Set(Object.values(s.brands).map(b=>b.group)))];
    const gsel=`<select id="gfilter">${groups.map(g=>`<option ${g===BFILTER?'selected':''}>${g}</option>`).join('')}</select>`;
    const ssel=`<select id="bsort"><option value="actual" ${BSORT==='actual'?'selected':''}>按实销</option><option value="growth" ${BSORT==='growth'?'selected':''}>按同比</option><option value="comp" ${BSORT==='comp'?'selected':''}>按完成率</option></select>`;
    let arr=Object.entries(s.brands).map(([n,b])=>({n,group:b.group,d:aggOf(b)}));
    if(BFILTER!=='全部') arr=arr.filter(x=>x.group===BFILTER);
    arr.sort((a,b)=> BSORT==='growth' ? (b.d.growth??-1e9)-(a.d.growth??-1e9) : BSORT==='comp' ? b.d.comp-a.d.comp : b.d.actual-a.d.actual);
    const mx=Math.max(...arr.map(x=>x.d.actual),1);
    const tb=`<table><thead><tr><th>品牌</th><th>集团</th><th>实销</th><th>目标</th><th>完成率</th><th>同比</th><th></th></tr></thead><tbody>
      ${arr.map(x=>`<tr><td class="st">${x.n}</td><td>${x.group}</td><td>${fmt(x.d.actual)}</td><td>${fmt(x.d.target)}</td><td class="${x.d.comp>=100?'good':'warn'}">${pct(x.d.comp)}</td><td class="${gcls(x.d.growth)}">${gv(x.d.growth)}</td><td style="width:120px"><div class="mini" style="width:${(x.d.actual/mx*100).toFixed(1)}%"></div></td></tr>`).join('')}</tbody></table>`;
    p.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>品牌明细（${perLab()}）<span style="color:var(--mut);font-weight:400;font-size:12px">（单位：千元）</span></h3><div>集团 ${gsel} 排序 ${ssel}</div></div>${tb}</div>`;
    $('#gfilter').onchange=e=>{BFILTER=e.target.value;renderPanel(s);};
    $('#bsort').onchange=e=>{BSORT=e.target.value;renderPanel(s);};
  } else if(DIM==='storebrand'){
    const opts=Object.entries(s.stores).map(([code,x])=>`<option value="${code}" ${code===STORE_SEL?'selected':''}>${x.name}</option>`).join('');
    const sb=s.stores[STORE_SEL].brands;
    let arr=Object.entries(sb).map(([n,b])=>({n,group:b.group,d:aggOf(b)})).sort((a,b)=>b.d.actual-a.d.actual);
    const mx=Math.max(...arr.map(x=>x.d.actual),1);
    const tb=`<table><thead><tr><th>品牌</th><th>集团</th><th>实销</th><th>目标</th><th>完成率</th><th>同比</th><th></th></tr></thead><tbody>
      ${arr.map(x=>`<tr><td class="st">${x.n}</td><td>${x.group}</td><td>${fmt(x.d.actual)}</td><td>${fmt(x.d.target)}</td><td class="${x.d.comp>=100?'good':'warn'}">${pct(x.d.comp)}</td><td class="${gcls(x.d.growth)}">${gv(x.d.growth)}</td><td style="width:120px"><div class="mini" style="width:${(x.d.actual/mx*100).toFixed(1)}%"></div></td></tr>`).join('')}</tbody></table>`;
    const bars=hbar(arr.map(x=>({label:x.n,value:x.d.actual,target:x.d.target,sub:`${fmt(x.d.actual)} 千元 · 完成 ${pct(x.d.comp)} · 同比 ${gv(x.d.growth)}`})));
    const at=ANNUAL[STORE_SEL]||0;const yt=s.stores[STORE_SEL].ytd.actual;const acomp=at?yt/at*100:0;const arem=at-yt;
    p.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>${s.stores[STORE_SEL].name} · 全品牌目标完成 <span style="color:var(--mut);font-weight:400;font-size:12px">（${perLab()} ｜ 单位：千元）</span></h3><select id="storeSel">${opts}</select></div>
      <div class="note">${s.stores[STORE_SEL].name} 年度目标 <b>${at?fmt(at)+' 千元':'—'}</b> ｜ 1–${s.as_of_month} 累计 <b>${fmt(yt)} 千元</b> ｜ 年度完成率 <b>${pct(acomp)}</b> ｜ 剩余需完成 <b>${arem>0?'+':''}${fmt(arem)} 千元</b></div>
      ${tb}<div style="margin-top:12px">${bars}</div></div>`;
    $('#storeSel').onchange=e=>{STORE_SEL=e.target.value;renderPanel(s);};
  }
}
// 事件
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{DIM=b.dataset.dim;document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPanel(HISTORY[IDX]);});
$('#periodToggle').querySelectorAll('button').forEach(b=>b.onclick=()=>{PERIOD=b.dataset.p;document.querySelectorAll('#periodToggle button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();});
$('#snapSel').onchange=e=>{IDX=+e.target.value;MM=HISTORY[IDX].as_of_idx;render();};
$('#monthSel').onchange=e=>{MM=+e.target.value;render();};
$('#importBtn').onclick=()=>{
  if(window.__EMBEDDED__){ toast('云端版不支持直接上传；请在本地 app.py 导入新报表后重新部署'); return; }
  $('#fileInput').click();
};
$('#fileInput').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  toast('解析中…');
  const buf=await f.arrayBuffer();
  const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Filename':encodeURIComponent(f.name)},body:buf});
  const j=await r.json();
  if(j.ok){toast('已导入：'+j.message);load();}
  else toast('导入失败：'+(j.error||'未知错误'));
  e.target.value='';
};
load();
</script>
</body></html>
