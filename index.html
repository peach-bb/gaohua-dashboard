}

// 按当前「单月/累计/自选」取聚合值；obj 须含 monthly（逐月明细）
function selMonths(){return SEL.filter(m=>m>=1&&m<=12).slice().sort((a,b)=>a-b);}
function quarterOf(m){return Math.floor((m-1)/3)+1;}
function selLabel(){
  const ms=selMonths(); if(!ms.length) return '自选（未选月份）';
  const q=QKEY[ms.join(',')];
  if(q) return QNAME[q]+'（'+MONTH_CN[ms[0]-1]+'–'+MONTH_CN[ms[ms.length-1]-1]+'）合计';
  if(ms.length===12) return '全年（1月–12月）合计';
  let contig=true; for(let i=1;i<ms.length;i++){if(ms[i]!==ms[i-1]+1){contig=false;break;}}
  if(contig) return MONTH_CN[ms[0]-1]+'–'+MONTH_CN[ms[ms.length-1]-1]+' 合计';
  return '自选 '+ms.map(m=>MONTH_CN[m-1]).join('+')+' 合计';
}
function monthsOf(){
  let ms=[];
  if(PERIOD==='sel') ms=selMonths();
  else for(let m=1;m<=MM;m++) ms.push(m);
  return ms;
}
function aggOf(obj){
  if(!obj) return {target:0,actual:0,ly:0,comp:0,growth:null};
  if(!obj.monthly) return obj[PERIOD]?obj[PERIOD]:{target:0,actual:0,ly:0,comp:0,growth:null};
  if(PERIOD==='jul') return obj.monthly[MM]||{target:0,actual:0,ly:0,comp:0,growth:null};
  let T=0,A=0,L=0;
  monthsOf().forEach(m=>{const d=obj.monthly[m]; if(d){T+=d.target;A+=d.actual;L+=d.ly;}});
  const comp=T?A/T*100:0, growth=L?((A-L)/L*100):null;
  return {target:T,actual:A,ly:L,comp,growth};
}
function singleOf(obj,mm){
  const d=(obj&&obj.monthly)?obj.monthly[mm]:null;
  if(!d) return {target:0,actual:0,ly:0,comp:0,growth:null};
  const comp=d.target?d.actual/d.target*100:0, growth=d.ly?((d.actual-d.ly)/d.ly*100):null;
  return {target:d.target,actual:d.actual,ly:d.ly,comp,growth};
}
function cumOf(obj,mm){
  let T=0,A=0,L=0;
  for(let m=1;m<=mm;m++){const d=(obj&&obj.monthly)?obj.monthly[m]:null; if(d){T+=d.target;A+=d.actual;L+=d.ly;}}
  const comp=T?A/T*100:0, growth=L?((A-L)/L*100):null;
  return {target:T,actual:A,ly:L,comp,growth};
}
const perLab=()=>PERIOD==='jul'?(MONTH_CN[MM-1]+' 单月'):(PERIOD==='sel'?selLabel():('累计 1–'+MONTH_CN[MM-1]));
// 当前口径所含月份数：单月=1；累计=1..MM；自选=所勾月份个数。用于「月单产」= 实销 ÷ 月份数
function periodMonths(){
  if(PERIOD==='jul') return 1;
  return Math.max(monthsOf().length,1);
}

function render(){
  const ss=$('#snapSel');ss.innerHTML='';
  HISTORY.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.year+'年 '+s.as_of_month+(s.as_of_idx===12?'（全年）':'');if(i===IDX)o.selected=true;ss.appendChild(o);});
  const s=HISTORY[IDX];if(!s){$('#kpis').innerHTML='<div class="empty">暂无数据，请点右上角"导入新报表"上传 xlsx</div>';$('#panel').innerHTML='';syncTabs();return;}
  if(MM===0||MM>s.as_of_idx) MM=s.as_of_idx;
  if(PERIOD==='sel') SEL=SEL.filter(m=>m>=1&&m<=s.as_of_idx);
  renderMonthSel(s);renderSelBar(s);syncTabs();
  renderKPI(s);renderPanel(s);
}
// 无对应城市数据时隐藏该标签页；若当前停留在被隐藏的页，退回「整体」
function syncTabs(){
  const btns=document.querySelectorAll('#tabs button');
  let fallback=false;
  btns.forEach(function(b){
    if(!b.dataset.city){b.style.display='';return;}
    const ok=!!CITY_RANK[b.dataset.city];
    b.style.display=ok?'':'none';
    if(!ok&&b.classList.contains('active')) fallback=true;
  });
  if(fallback){DIM='overall';btns.forEach(function(x){x.classList.remove('active');});
    const ov=document.querySelector('#tabs button[data-dim="overall"]'); if(ov) ov.classList.add('active');renderPanel(HISTORY[IDX]);}
}
function renderSelBar(s){
  const bar=$('#selBar'), wrap=$('#monthSelWrap');
  if(PERIOD!=='sel'){bar.classList.remove('show');wrap.style.display='';return;}
  wrap.style.display='none';bar.classList.add('show');
  const n=s.as_of_idx, ms=selMonths();
  const chips=[];
  for(let m=1;m<=n;m++){
    const on=ms.includes(m);
    chips.push(`<label class="mchip ${on?'on':''}"><input type="checkbox" data-m="${m}" ${on?'checked':''}>${MONTH_CN[m-1]}</label>`);
  }
  const qs=[1,2,3,4].map(q=>{
    const months=[q*3-2,q*3-1,q*3].filter(m=>m>=1&&m<=n);
    if(!months.length) return '';
    const on=months.join(',')===ms.join(',');
    return `<button class="qbtn ${on?'on':''}" data-q="${q}">${QNAME[q]}</button>`;
  }).join('');
  bar.innerHTML=`<span class="sblab">勾选月份：</span>${chips.join('')}<span class="sdiv"></span>${qs}
    <button class="qbtn" data-q="all">全选</button><button class="qbtn" data-q="none">清空</button>
    <span class="selinfo">${selLabel()}　共 ${ms.length} 个月</span>`;
  bar.querySelectorAll('input[data-m]').forEach(cb=>cb.onchange=()=>{
    const m=+cb.dataset.m;
    if(cb.checked){if(!SEL.includes(m))SEL.push(m);}else{SEL=SEL.filter(x=>x!==m);}
    render();
  });
  bar.querySelectorAll('button[data-q]').forEach(b=>b.onclick=()=>{
    const q=b.dataset.q;
    if(q==='all'){SEL=[];for(let m=1;m<=n;m++)SEL.push(m);}
    else if(q==='none'){SEL=[];}
    else{const qi=+q;SEL=[qi*3-2,qi*3-1,qi*3].filter(m=>m>=1&&m<=n);}

}
function renderMonthSel(s){

function hbar(items){

  const yl=[0,mx/2,mx].map(v=>`<text x="6" y="${(sy(v)+4).toFixed(1)}" class="yl">${Math.round(v).toLocaleString()}</text>`).join('');
  const dots=acts.map((v,i)=>`<circle cx="${sx(i).toFixed(1)}" cy="${sy(v).toFixed(1)}" r="3" class="dot"/>`).join('');
  const ring=(i,txt)=>`<circle cx="${sx(i).toFixed(1)}" cy="${sy(acts[i]).toFixed(1)}" r="5" fill="none" stroke="#e23b3b" stroke-width="2"/>`+(txt?`<text x="${sx(i).toFixed(1)}" y="${(sy(acts[i])-10).toFixed(1)}" class="xl" fill="#e23b3b">${txt}</text>`:'');
  const hl=(PERIOD==='jul'&&MM-1<n)?ring(MM-1,MONTH_CN[MM-1]):(PERIOD==='sel'?selMonths().filter(m=>m-1<n).map(m=>ring(m-1,'')).join(''):'');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" class="ax"/><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" class="ax"/><polygon points="${area}" class="area"/><path d="${tp}" class="line tgt"/><path d="${ap}" class="line act"/>${yl}${xl}${dots}${hl}</svg>`;
}
function annualCard(s){
  const yt=s.overall.ytd.actual;
  const comp=ANNUAL_TOTAL?yt/ANNUAL_TOTAL*100:0;
  const remain=ANNUAL_TOTAL-yt;
  const left=12-s.as_of_idx;
  const need=left>0?remain/left:0;
  return `<div class="card"><h3>2026 年度目标达成（截至 ${s.as_of_month}）</h3>
    <div class="kpis" style="margin-bottom:10px">
      <div class="kpi"><div class="t">年度总目标</div><div class="big">${fmt(ANNUAL_TOTAL)}</div><div class="sm">约 3.48 亿 ｜ 万元</div></div>
      <div class="kpi"><div class="t">1–${s.as_of_month} 已累计</div><div class="big">${fmt(yt)}</div><div class="sm">占年度目标 ${pct(comp)}</div></div>
      <div class="kpi"><div class="t">年度完成率</div><div class="big ${comp>=50?'good':'warn'}">${pct(comp)}</div><div class="sm">剩余 ${fmt(remain)} 万元</div></div>
      <div class="kpi"><div class="t">剩余需完成（至 12 月）</div><div class="big">${fmt(remain)}</div><div class="sm">剩 ${left} 个月 ｜ 月均需 ${fmt(need)} 万元</div></div>
    </div>
    <div class="note">整体年度目标 <b>${fmt(ANNUAL_TOTAL)} 万元（约 3.48 亿）</b>，截至 ${s.as_of_month} 累计实销 <b>${fmt(yt)} 万元</b>，完成 <b>${pct(comp)}</b>；剩余 <b>${fmt(remain)} 万元</b> 需在 ${left} 个月（${s.as_of_idx+1}–12 月）补齐，月均需 <b>${fmt(need)} 万元</b>。</div>
  </div>`;
}
// 城市排名（同城对比店 POS 数据，来自 city_rank.json，与月度快照相互独立）
function cityRankPanel(cityKey, cityName){
  const c=CITY_RANK[cityKey];
  if(!c) return '<div class="card"><div class="empty">暂无「'+cityName+'」对比店数据</div></div>';
  const cf=v=>v==null?'—':Math.round(v).toLocaleString('en-US');
  const chg=(cur,prev)=>{
    if(typeof cur==='number'&&typeof prev==='number'){const d=prev-cur;return d===0?'持平':(d>0?'↑'+d:'↓'+(-d));}
    return '—';
  };
  const stores=c.stores||[];
  const head='<th>品牌</th><th>本期排名</th><th>同期排名</th>'+stores.map(s=>'<th>'+String(s).replace('POS','')+'</th>').join('')+'<th>排名变化</th>';
  const body=(c.rows||[]).map(x=>{
    const isTot=(x.brand==='合计'||x.brand==='销售合计');
    return '<tr class="'+(isTot?'tot':'')+'"><td class="st">'+x.brand+'</td><td>'+(x.cur==null?'—':x.cur)+'</td><td>'+(x.prev==null?'—':x.prev)+'</td>'
      +stores.map(s=>'<td>'+cf(x.pos?x.pos[s]:null)+'</td>').join('')
      +'<td>'+chg(x.cur,x.prev)+'</td></tr>';
  }).join('');
  return '<div class="card"><h3>'+cityName+'城市排名 · 品牌对比 <span style="color:var(--mut);font-weight:400;font-size:12px">（POS 销售额，单位：万元 ｜ '+(c.range||'2026 年 1-6 月半年度')+'）</span></h3>'
    +'<div class="tblwrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'
    +'<div class="note">数据范围：高化对比店数据（'+(c.range||'2026 年 1-6 月（半年度）')+'）。本期/同期 = 品牌在该城市各商场的销售排名（数字越小越靠前）；排名变化 = 同期 − 本期（↑ 上升 ↓ 下降）；「*」表示无同期可比或该商场未经营。'+(c.note||'')+'</div></div>';
}
function renderPanel(s){
  const p=$('#panel');
  if(DIM==='overall'){
    const lf=aggOf(s.lfl);
    p.innerHTML=`${annualCard(s)}
      <div class="card"><h3>整体月度实销趋势（1–${s.as_of_month}）· 实销 vs 目标 <span style="color:var(--mut);font-weight:400;font-size:12px">（纵轴单位：万元）</span></h3>${lineChart(s)}
      <div class="legend"><b style="color:#2f6fed">■</b> 实销　<b style="color:#e0852b">┄</b> 目标　单位：万元　<b style="color:#e23b3b">○</b> ${PERIOD==='sel'?'所选月':'选中月'}</div></div>
      <div class="card"><h3>同店口径（剔除东莞新店）</h3>
      <div class="note">${perLab()}：实销 ${fmt(lf.actual)} 万元 ｜ 完成率 ${pct(lf.comp)} ｜ 同比 ${gv(lf.growth)}<br>
      累计（1–${s.as_of_month}）：实销 ${fmt(s.lfl.ytd.actual)} 万元 ｜ 完成率 ${pct(s.lfl.ytd.comp)} ｜ 同比 ${gv(s.lfl.ytd.growth)}</div></div>`;
  } else if(DIM==='store'){
    const arr=Object.entries(s.stores).map(([code,x])=>({code,n:x.name,d:aggOf(x),at:ANNUAL[code]||0})).sort((a,b)=>b.d.actual-a.d.actual);
    const tb=`<table><thead><tr><th>门店</th><th>实销（${perLab()}）</th><th>目标</th><th>完成率</th><th>同比</th><th>年度目标</th><th>年度完成率</th><th>剩余需完成</th></tr></thead><tbody>
      ${arr.map(x=>{const at=x.at;const ac=x.d.actual;const acomp=at?ac/at*100:0;const arem=at-ac;return `<tr><td class="st">${x.n}</td><td>${fmt(ac)}</td><td>${fmt(x.d.target)}</td><td class="${x.d.comp>=100?'good':'warn'}">${pct(x.d.comp)}</td><td class="${gcls(x.d.growth)}">${gv(x.d.growth)}</td><td>${at?fmt(at):'—'}</td><td class="${acomp>=100?'good':'warn'}">${pct(acomp)}</td><td class="${arem>0?'warn':'good'}">${arem>0?'+':''}${fmt(arem)}</td></tr>`}).join('')}</tbody></table>`;
    const bars=hbar(arr.map(x=>({label:x.n,value:x.d.actual,target:x.d.target,sub:`${fmt(x.d.actual)} 万元 · 完成 ${pct(x.d.comp)} · 同比 ${gv(x.d.growth)}`})));
    p.innerHTML=`<div class="card"><h3>五店对比 <span style="color:var(--mut);font-weight:400;font-size:12px">（单位：万元）</span></h3>${tb}<div style="margin-top:12px">${bars}</div></div>`;
  } else if(DIM==='group'){
    const arr=Object.entries(s.groups).map(([n,d])=>({n,d:aggOf(d)})).sort((a,b)=>b.d.actual-a.d.actual);
    const tb=`<table><thead><tr><th>集团</th><th>实销（${perLab()}）</th><th>目标</th><th>完成率</th><th>同比</th></tr></thead><tbody>
      ${arr.map(x=>`<tr><td class="st">${x.n}</td><td>${fmt(x.d.actual)}</td><td>${fmt(x.d.target)}</td><td class="${x.d.comp>=100?'good':'warn'}">${pct(x.d.comp)}</td><td class="${gcls(x.d.growth)}">${gv(x.d.growth)}</td></tr>`).join('')}</tbody></table>`;
    const bars=hbar(arr.map(x=>({label:x.n,value:x.d.actual,target:x.d.target,sub:`${fmt(x.d.actual)} 万元 · 完成 ${pct(x.d.comp)} · 同比 ${gv(x.d.growth)}`})));
    p.innerHTML=`<div class="card"><h3>集团对比（${perLab()}）<span style="color:var(--mut);font-weight:400;font-size:12px">（单位：万元）</span></h3>${tb}<div style="margin-top:12px">${bars}</div></div>`;
  } else if(DIM==='brand'){
    const groups=['全部',...Array.from(new Set(Object.values(s.brands).map(b=>b.group)))];
    const gsel=`<select id="gfilter">${groups.map(g=>`<option ${g===BFILTER?'selected':''}>${g}</option>`).join('')}</select>`;
    const ssel=`<select id="bsort"><option value="actual" ${BSORT==='actual'?'selected':''}>按实销</option><option value="growth" ${BSORT==='growth'?'selected':''}>按同比</option><option value="comp" ${BSORT==='comp'?'selected':''}>按完成率</option></select>`;
    let arr=Object.entries(s.brands).map(([n,b])=>({n,group:b.group,d:aggOf(b)}));
    if(BFILTER!=='全部') arr=arr.filter(x=>x.group===BFILTER);
    arr.sort((a,b)=> BSORT==='growth' ? (b.d.growth??-1e9)-(a.d.growth??-1e9) : BSORT==='comp' ? b.d.comp-a.d.comp : b.d.actual-a.d.actual);
    const mx=Math.max(...arr.map(x=>x.d.actual),1);
    const tb=`<table><thead><tr><th>品牌</th><th>集团</th><th>实销</th><th>目标</th><th>完成率</th><th>同比</th><th>月单产</th><th></th></tr></thead><tbody>
      ${arr.map(x=>`<tr><td class="st">${x.n}</td><td>${x.group}</td><td>${fmt(x.d.actual)}</td><td>${fmt(x.d.target)}</td><td class="${x.d.comp>=100?'good':'warn'}">${pct(x.d.comp)}</td><td class="${gcls(x.d.growth)}">${gv(x.d.growth)}</td><td><b>${fmt(x.d.actual/periodMonths())}</b></td><td style="width:120px"><div class="mini" style="width:${(x.d.actual/mx*100).toFixed(1)}%"></div></td></tr>`).join('')}</tbody></table>`;
    p.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>品牌明细（${perLab()}）<span style="color:var(--mut);font-weight:400;font-size:12px">（单位：万元）</span></h3><div>集团 ${gsel} 排序 ${ssel}</div></div>${tb}<div class="note">月单产 = 该品牌实销 ÷ ${periodMonths()} 个月（当前口径：${perLab()}），单位：万元/月。</div></div>`;
    $('#gfilter').onchange=e=>{BFILTER=e.target.value;renderPanel(s);};
    $('#bsort').onchange=e=>{BSORT=e.target.value;renderPanel(s);};
  } else if(DIM==='storebrand'){
    const opts=Object.entries(s.stores).map(([code,x])=>`<option value="${code}" ${code===STORE_SEL?'selected':''}>${x.name}</option>`).join('');
    const sb=s.stores[STORE_SEL].brands;
    let arr=Object.entries(sb).map(([n,b])=>({n,group:b.group,d:aggOf(b)})).sort((a,b)=>b.d.actual-a.d.actual);
    const mx=Math.max(...arr.map(x=>x.d.actual),1);
    const tb=`<table><thead><tr><th>品牌</th><th>集团</th><th>实销</th><th>目标</th><th>完成率</th><th>同比</th><th>月单产</th><th></th></tr></thead><tbody>
      ${arr.map(x=>`<tr><td class="st">${x.n}</td><td>${x.group}</td><td>${fmt(x.d.actual)}</td><td>${fmt(x.d.target)}</td><td class="${x.d.comp>=100?'good':'warn'}">${pct(x.d.comp)}</td><td class="${gcls(x.d.growth)}">${gv(x.d.growth)}</td><td><b>${fmt(x.d.actual/periodMonths())}</b></td><td style="width:120px"><div class="mini" style="width:${(x.d.actual/mx*100).toFixed(1)}%"></div></td></tr>`).join('')}</tbody></table>`;
    const bars=hbar(arr.map(x=>({label:x.n,value:x.d.actual,target:x.d.target,sub:`${fmt(x.d.actual)} 万元 · 完成 ${pct(x.d.comp)} · 同比 ${gv(x.d.growth)}`})));
    const at=ANNUAL[STORE_SEL]||0;const yt=s.stores[STORE_SEL].ytd.actual;const acomp=at?yt/at*100:0;const arem=at-yt;
    p.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>${s.stores[STORE_SEL].name} · 全品牌目标完成 <span style="color:var(--mut);font-weight:400;font-size:12px">（${perLab()} ｜ 单位：万元）</span></h3><select id="storeSel">${opts}</select></div>
      <div class="note">${s.stores[STORE_SEL].name} 年度目标 <b>${at?fmt(at)+' 万元':'—'}</b> ｜ 1–${s.as_of_month} 累计 <b>${fmt(yt)} 万元</b> ｜ 年度完成率 <b>${pct(acomp)}</b> ｜ 剩余需完成 <b>${arem>0?'+':''}${fmt(arem)} 万元</b>　｜　月单产 = 该店各品牌实销 ÷ ${periodMonths()} 个月（万元/月）</div>
      ${tb}<div style="margin-top:12px">${bars}</div></div>`;
    $('#storeSel').onchange=e=>{STORE_SEL=e.target.value;renderPanel(s);};
  } else if(DIM==='city_nc'){
    p.innerHTML=cityRankPanel('南昌','南昌（含赣州）');
  } else if(DIM==='city_sz'){
    p.innerHTML=cityRankPanel('深圳','深圳');
  }
}
// 事件
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{DIM=b.dataset.dim;document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPanel(HISTORY[IDX]);});
$('#periodToggle').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  PERIOD=b.dataset.p;
  if(PERIOD==='sel'){
    const s=HISTORY[IDX],n=s?s.as_of_idx:12;
    SEL=SEL.filter(m=>m>=1&&m<=n);
    if(!SEL.length){const q=quarterOf(Math.min(MM||n,n));SEL=[];for(let m=q*3-2;m<=q*3;m++){if(m>=1&&m<=n)SEL.push(m);}}
  }
  document.querySelectorAll('#periodToggle button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();
});
$('#snapSel').onchange=e=>{IDX=+e.target.value;MM=HISTORY[IDX].as_of_idx;render();};
$('#monthSel').onchange=e=>{MM=+e.target.value;render();};
$('#importBtn').onclick=()=>{
  if(window.__EMBEDDED__){ toast('云端版不支持直接上传；请在本地 app.py 导入新报表后重新部署'); return; }
  $('#fileInput').click();
};
$('#fileInput').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  toast('解析中…');
  const buf=await f.arrayBuffer();
  const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Filename':encodeURIComponent(f.name)},body:buf});
  const j=await r.json();
  if(j.ok){toast('已导入：'+j.message);load();}
  else toast('导入失败：'+(j.error||'未知错误'));
  e.target.value='';
};
load();
</script>
</body></html>
